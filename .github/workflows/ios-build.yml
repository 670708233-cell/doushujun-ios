name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Validate project file (3-way bisect)
        run: |
          run_list() {
            # 用法: run_list <label> [ENV=1 ...]  —— 先清理再生成再 list
            LABEL="$1"; shift
            rm -rf Doushujun.xcodeproj
            env "$@" python3 generate_project.py > /dev/null || exit 1
            echo ""
            echo "############ [$LABEL] ($*) ############"
            xcodebuild -list -project Doushujun.xcodeproj > list_out.txt 2>&1
            RC=$?
            if [ $RC -eq 0 ]; then
              echo "[$LABEL] xcodebuild -list OK"
              tail -12 list_out.txt
              return 0
            fi
            echo "[$LABEL] xcodebuild -list FAILED (exit $RC)"
            tail -8 list_out.txt || true
            return 1
          }

          BISECT=0
          run_list full || BISECT=1
          run_list no-scheme DSJ_NO_SCHEME=1 || BISECT=2
          run_list no-uitest DSJ_NO_UITEST=1 || BISECT=3

          if [ "$BISECT" != "0" ]; then
            echo ""
            echo ">>> BISECT RESULT: failed mode = $BISECT (1=full, 2=no-scheme, 3=no-uitest)"
            echo ""
            echo "=== lldb backtrace on full mode ==="
            rm -rf Doushujun.xcodeproj
            python3 generate_project.py > /dev/null
            lldb -b -o run -o 'thread backtrace' -o 'quit' -- xcodebuild -list -project Doushujun.xcodeproj 2>&1 | tail -60
            echo ""
            echo "=== crash reports (after 15s wait) ==="
            sleep 15
            ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -8 || true
            CRASH=$(ls -t ~/Library/Logs/DiagnosticReports/xcodebuild*.ips 2>/dev/null | head -1)
            if [ -n "$CRASH" ]; then
              echo "=== $CRASH ==="
              head -c 6000 "$CRASH" || true
            fi
            exit 1
          fi
          echo ">>> ALL 3 MODES OK - project file healthy"

      - name: Clean and Build
        id: build
        run: |
          echo "=== Cleaning ==="
          rm -rf build
          mkdir -p build

          echo "=== Building ==="
          set -o pipefail

          xcodebuild build \
            -project Doushujun.xcodeproj \
            -scheme Doushujun \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}
          echo "Build exit code: $EXIT_CODE"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          grep -q "BUILD SUCCEEDED" build.log || {
            echo "ERROR: BUILD SUCCEEDED not found in log"
            exit 1
          }

      - name: Package IPA
        id: package
        run: |
          echo "=== Packaging IPA ==="
          APP=$(find build -name "Doushujun.app" -type d 2>/dev/null | head -1)

          echo "App path: '$APP'"

          if [ -z "$APP" ]; then
            echo "ERROR: No Doushujun.app found!"
            find build -name "*.app" -type d 2>/dev/null
            exit 1
          fi

          echo "Found app: $APP"
          du -sh "$APP"

          if [ ! -f "$APP/Doushujun" ]; then
            echo "ERROR: Binary not found!"
            ls -la "$APP"
            exit 1
          fi

          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/

          echo "=== Creating IPA ==="
          zip -qr Doushujun-unsigned.ipa Payload/
          rm -rf Payload

          if [ -f Doushujun-unsigned.ipa ]; then
            echo "=== IPA created ==="
            ls -lh Doushujun-unsigned.ipa
            unzip -l Doushujun-unsigned.ipa | head -20
          else
            echo "ERROR: IPA file not created!"
            ls -la *.ipa 2>/dev/null || echo "No .ipa files"
            exit 1
          fi

      - name: Upload IPA
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Doushujun-unsigned
          path: Doushujun-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

  uitest:
    name: UI Test (Simulator + Local Backend)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Checkout backend (private repo)
        uses: actions/checkout@v4
        with:
          repository: 670708233-cell/doushujun-php
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: backend

      - name: Verify Xcode & pick simulator
        id: sim
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" || true
          SIM=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+( Pro Max| Plus)?" | head -1)
          echo "Using simulator: $SIM"
          echo "name=$SIM" >> "$GITHUB_OUTPUT"

      - name: Start MySQL (brew)
        run: |
          brew install mysql
          brew services start mysql
          for i in $(seq 1 30); do
            mysqladmin ping 2>/dev/null && break
            sleep 2
          done
          mysql -e "CREATE DATABASE IF NOT EXISTS dcc CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql dcc < backend/database/schema.sql
          mysql dcc -e "SELECT COUNT(*) AS tables_count FROM information_schema.tables WHERE table_schema='dcc';"
          # 测试账号（密码 Uitest#2026 的 bcrypt hash）
          mysql dcc -e "INSERT INTO users (username, email, password, balance, invite_code, nickname) VALUES ('uitester', 'uitest@doushujun.local', '\$2y\$10\$aDv.o2d7NGaFE5BGjD3wG.dKyqlvVxSDufWEBHffxjJHRnYjoZO/O', 100, 'UITEST01', 'UI自动化测试账号');"

      - name: Start PHP backend
        run: |
          cd backend
          cp env.ci .env
          mkdir -p runtime/cache runtime/log
          # macos runner 不预装 composer；brew 默认 php 8.4 与生产 8.2 不兼容（think 8 已知炸）
          brew install composer php@8.2 2>&1 | tail -2
          export PATH="$(brew --prefix php@8.2)/bin:$PATH"
          php -v | head -1
          composer install --no-scripts --no-interaction --prefer-dist --no-progress 2>&1 | tail -3
          nohup php think run --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          BACKEND_UP=0
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/captcha/slider/generate || true)
            if [ "$CODE" != "000" ]; then
              echo "backend UP (http $CODE)"
              BACKEND_UP=1
              break
            fi
            sleep 2
          done
          if [ "$BACKEND_UP" != "1" ]; then
            echo "::error::backend did not respond"
            tail -30 server.log || true
            exit 1
          fi
          # 硬校验 1：slider/generate 必须 200；失败时打印异常详情页（APP_DEBUG 下含堆栈）
          GEN_CODE=$(curl -s -o gen_body.txt -w "%{http_code}" http://127.0.0.1:8000/api/captcha/slider/generate)
          if [ "$GEN_CODE" != "200" ]; then
            echo "::error::slider/generate http $GEN_CODE, exception summary:"
            grep -oE '<h1>[^<]*</h1>|<h2>[^<]*</h2>|class="message"[^<]*<|<div class="info">[^<]*' gen_body.txt | head -10 || true
            echo "--- full body first 6000 chars ---"
            head -c 6000 gen_body.txt || true
            exit 1
          fi
          echo "slider/generate OK: $(head -c 200 gen_body.txt)"
          # 硬校验 2：debug 模式回传明文验证码（缺失直接 fail，避免 UI 测试空跑 7 分钟）
          curl -s "http://127.0.0.1:8000/api/captcha/generate" | grep -o "captcha_code" || { echo "::error::captcha_code missing - APP_DEBUG not effective"; exit 1; }

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Run UI tests on simulator
        id: test
        run: |
          set -o pipefail
          # 无头模拟器必须禁硬件键盘，否则 tap 文本框后软键盘不弹出，typeText 报 keyboard focus 失败
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcodebuild test \
            -project Doushujun.xcodeproj \
            -scheme Doushujun \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee uitest.log

          grep -q "TEST SUCCEEDED" uitest.log || {
            echo "ERROR: TEST SUCCEEDED not found"
            grep -E "Test Case.*(failed|passed)" uitest.log | tail -20
            exit 1
          }
          grep -E "Test Case.*(failed|passed)" uitest.log

      - name: Backend liveness probe
        if: always()
        run: |
          # php -S 是单线程服务器：慢请求可阻塞全部后续请求甚至崩掉
          # （实证：负向用例的登录请求根本没到后端，弹窗是客户端网络失败兜底文案）
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 http://127.0.0.1:8000/api/captcha/generate || echo "000")
          echo "backend probe after tests: http $CODE"
          pgrep -fl "php think run" || echo "!! php server NOT running"
          echo "--- server.log tail ---"
          tail -15 backend/server.log || true

      - name: Collect crash reports
        if: always()
        run: |
          # app 进程中途死亡（XCUITest 报 state=notRunning）必留崩溃痕迹
          for f in ~/Library/Logs/DiagnosticReports/Doushujun*.ips ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -f "$f" ] || continue
            echo "=== $(basename "$f") ==="
            head -c 2500 "$f"
            echo
          done
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -10 || echo "(no diag reports)"

      - name: Upload UI test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-log
          path: uitest.log
          retention-days: 7

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/server.log
          retention-days: 7
