name: iOS Build (Unsigned IPA)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep iphoneos

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Validate project file
        run: |
          plutil -lint Doushujun.xcodeproj/project.pbxproj || true
          xcodebuild -list -project Doushujun.xcodeproj || {
            echo "=== xcodebuild crashed, dumping latest crash reports ==="
            ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head -5 || true
            CRASH=$(ls -t ~/Library/Logs/DiagnosticReports/xcodebuild*.ips 2>/dev/null | head -1)
            if [ -n "$CRASH" ]; then
              echo "=== $CRASH ==="
              head -c 6000 "$CRASH" || true
            fi
            exit 1
          }

      - name: Clean and Build
        id: build
        run: |
          echo "=== Cleaning ==="
          rm -rf build
          mkdir -p build

          echo "=== Building ==="
          set -o pipefail

          xcodebuild build \
            -project Doushujun.xcodeproj \
            -scheme Doushujun \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log

          EXIT_CODE=${PIPESTATUS[0]}
          echo "Build exit code: $EXIT_CODE"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

          grep -q "BUILD SUCCEEDED" build.log || {
            echo "ERROR: BUILD SUCCEEDED not found in log"
            exit 1
          }

      - name: Package IPA
        id: package
        run: |
          echo "=== Packaging IPA ==="
          APP=$(find build -name "Doushujun.app" -type d 2>/dev/null | head -1)

          echo "App path: '$APP'"

          if [ -z "$APP" ]; then
            echo "ERROR: No Doushujun.app found!"
            find build -name "*.app" -type d 2>/dev/null
            exit 1
          fi

          echo "Found app: $APP"
          du -sh "$APP"

          if [ ! -f "$APP/Doushujun" ]; then
            echo "ERROR: Binary not found!"
            ls -la "$APP"
            exit 1
          fi

          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/

          echo "=== Creating IPA ==="
          zip -qr Doushujun-unsigned.ipa Payload/
          rm -rf Payload

          if [ -f Doushujun-unsigned.ipa ]; then
            echo "=== IPA created ==="
            ls -lh Doushujun-unsigned.ipa
            unzip -l Doushujun-unsigned.ipa | head -20
          else
            echo "ERROR: IPA file not created!"
            ls -la *.ipa 2>/dev/null || echo "No .ipa files"
            exit 1
          fi

      - name: Upload IPA
        if: steps.package.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Doushujun-unsigned
          path: Doushujun-unsigned.ipa
          retention-days: 7

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

  uitest:
    name: UI Test (Simulator + Local Backend)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Checkout backend (private repo)
        uses: actions/checkout@v4
        with:
          repository: 670708233-cell/doushujun-php
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: backend

      - name: Verify Xcode & pick simulator
        id: sim
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" || true
          SIM=$(xcrun simctl list devices available | grep -oE "iPhone [0-9]+( Pro Max| Plus)?" | head -1)
          echo "Using simulator: $SIM"
          echo "name=$SIM" >> "$GITHUB_OUTPUT"

      - name: Start MySQL (brew)
        run: |
          brew install mysql
          brew services start mysql
          for i in $(seq 1 30); do
            mysqladmin ping 2>/dev/null && break
            sleep 2
          done
          mysql -e "CREATE DATABASE IF NOT EXISTS dcc CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql dcc < backend/database/schema.sql
          mysql dcc -e "SELECT COUNT(*) AS tables_count FROM information_schema.tables WHERE table_schema='dcc';"
          # 测试账号（密码 Uitest#2026 的 bcrypt hash）
          mysql dcc -e "INSERT INTO users (username, email, password, balance, invite_code, nickname, status, create_time) VALUES ('uitester', 'uitest@doushujun.local', '\$2y\$10\$aDv.o2d7NGaFE5BGjD3wG.dKyqlvVxSDufWEBHffxjJHRnYjoZO/O', 100, 'UITEST01', 'UI自动化测试账号', 1, NOW());"

      - name: Start PHP backend
        run: |
          cd backend
          cp env.ci .env
          mkdir -p runtime/cache runtime/log
          composer install --no-interaction --prefer-dist --no-progress 2>&1 | tail -3
          nohup php think run --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/api/captcha/slider/generate | grep -q 200 && { echo "backend UP"; break; }
            sleep 2
          done
          curl -s http://127.0.0.1:8000/api/captcha/slider/generate | head -c 200
          echo ""
          # 验证 debug 模式回传明文验证码
          curl -s "http://127.0.0.1:8000/api/captcha/image" | grep -o "captcha_code" || echo "WARN: captcha_code missing"

      - name: Generate Xcode project
        run: python3 generate_project.py

      - name: Run UI tests on simulator
        id: test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Doushujun.xcodeproj \
            -scheme Doushujun \
            -destination 'platform=iOS Simulator,name=${{ steps.sim.outputs.name }}' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee uitest.log

          grep -q "TEST SUCCEEDED" uitest.log || {
            echo "ERROR: TEST SUCCEEDED not found"
            grep -E "Test Case.*(failed|passed)" uitest.log | tail -20
            exit 1
          }
          grep -E "Test Case.*(failed|passed)" uitest.log

      - name: Upload UI test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-log
          path: uitest.log
          retention-days: 7

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend/server.log
          retention-days: 7
